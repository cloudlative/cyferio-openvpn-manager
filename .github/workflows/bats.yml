name: Unit tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats-core and sqlite3
        run: |
          sudo apt-get update
          sudo apt-get install -y bats sqlite3
      - name: Run unit tests
        run: bats tests/unit
