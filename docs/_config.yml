title: Cyferio OpenVPN Manager
# jekyll-seo-tag appends this to the homepage's <title> tag
# ("{{ site.title }} | {{ site.description }}"), so it needs to stay
# short for a clean, non-truncated search-result title — the longer
# pitch lives in docs/index.md's own page description instead, which
# jekyll-seo-tag uses for the actual <meta name="description"> on that
# page.
description: A bash-only OpenVPN deployment and management toolkit — no web UI, no browser dependency.
url: "https://cloudlative.github.io"
baseurl: "/cyferio-openvpn-manager"
repository: cloudlative/cyferio-openvpn-manager

theme: minima
markdown: kramdown
permalink: pretty

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# doc layout (docs/_layouts/doc.html) adds the prev/next architecture-
# docs pager; applied by path scope here so no per-file front matter
# edit is needed across all 12 docs.
defaults:
  - scope:
      path: "architecture"
      type: "pages"
    values:
      layout: doc
